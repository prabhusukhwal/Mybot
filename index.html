<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Website Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CRITICAL FIX 3: Mobile View (100dvh) */
        body { 
            min-height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            background-color: #111827; /* gray-900 */
            color: #f3f4f6; /* gray-100 */
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Ensuring the main wrapper adjusts around the flex-col body */
        #app-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
            flex-direction: column; /* Stack on mobile */
        }

        @media (min-width: 768px) {
            #app-wrapper {
                flex-direction: row; /* Side-by-side on desktop */
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        /* Hide element utility */
        .hidden-el { display: none !important; }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <div class="w-full md:w-64 bg-gray-900 border-b md:border-b-0 md:border-r border-gray-700 flex flex-col flex-shrink-0 h-48 md:h-full">
            <div class="p-4 border-b border-gray-700">
                <button onclick="createNewProject()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded flex items-center justify-center gap-2 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    New Project
                </button>
            </div>
            
            <div id="project-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                </div>

            <div class="p-4 border-t border-gray-700 flex-shrink-0">
                <button onclick="toggleSettings(true)" class="w-full flex items-center justify-center gap-2 text-gray-400 hover:text-white transition p-2 rounded hover:bg-gray-800">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Settings
                </button>
            </div>
        </div>

        <div class="flex-1 flex flex-col overflow-hidden bg-gray-800 relative">
            
            <header class="flex-shrink-0 bg-gray-900 border-b border-gray-700 p-3 flex items-center justify-between">
                <div class="flex space-x-2 text-xs select-none">
                    <span title="Close">🔴</span>
                    <span title="Minimize">🟡</span>
                    <span title="Maximize">🟢</span>
                </div>
                
                <div class="flex bg-gray-800 rounded p-1 border border-gray-700">
                    <button id="btn-preview" onclick="setView('preview')" class="px-3 py-1 text-sm rounded bg-gray-700 text-white shadow">Preview</button>
                    <button id="btn-code" onclick="setView('code')" class="px-3 py-1 text-sm rounded text-gray-400 hover:text-white">Code</button>
                </div>

                <button onclick="downloadHtml()" class="flex items-center gap-1 text-sm bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span class="hidden sm:inline">Download</span>
                </button>
            </header>

            <div class="flex-1 overflow-hidden relative bg-white">
                <iframe id="preview-frame" class="w-full h-full border-0 bg-white"></iframe>
                <div id="code-container" class="hidden-el absolute inset-0 bg-gray-900 p-4 overflow-auto">
                    <pre><code id="code-view" class="text-green-400 text-sm font-mono whitespace-pre-wrap"></code></pre>
                </div>
                
                <div id="loading-overlay" class="hidden-el absolute inset-0 bg-gray-900/80 flex flex-col items-center justify-center text-white backdrop-blur-sm">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white mb-4"></div>
                    <p class="animate-pulse font-semibold text-lg">Generating code...</p>
                </div>
            </div>

            <div class="flex-shrink-0 border-t border-gray-700 bg-gray-900 p-4">
                <form id="chat-form" onsubmit="handleSend(event)" class="flex gap-2 max-w-5xl mx-auto">
                    <textarea 
                        id="prompt-input" 
                        rows="2" 
                        placeholder="Describe the website you want to build..." 
                        class="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                        onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); handleSend(event); }"
                    ></textarea>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-5 font-bold transition flex items-center justify-center self-end h-[50px]">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="hidden-el fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 rounded-lg shadow-xl w-full max-w-md border border-gray-700 overflow-hidden">
            <div class="flex justify-between items-center p-4 border-b border-gray-700">
                <h2 class="text-xl font-bold text-white">Settings</h2>
                <button onclick="toggleSettings(false)" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            <div class="p-4 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">API URL</label>
                    <input type="text" id="setting-url" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white font-mono text-sm" value="https://openrouter.ai/api/v1/chat/completions">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">API Key</label>
                    <input type="password" id="setting-key" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white font-mono text-sm" placeholder="sk-or-v1-...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Model ID</label>
                    <input type="text" id="setting-model" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white font-mono text-sm" value="deepseek/deepseek-r1:free">
                </div>
            </div>
            <div class="p-4 border-t border-gray-700 bg-gray-900 flex justify-end">
                <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-semibold transition">Save Settings</button>
            </div>
        </div>
    </div>

    <script>
        // SYSTEM LOGIC
        const SYSTEM_PROMPT = `You are an expert web developer. Output ONLY raw, production-ready HTML code containing embedded CSS and JS. DO NOT wrap the code in markdown blocks like \`\`\`html. Start directly with <!DOCTYPE html>. Do not add explanations.`;
        
        let settings = {
            apiUrl: "https://openrouter.ai/api/v1/chat/completions", // CRITICAL FIX 1: OpenRouter forced
            apiKey: "",
            modelId: "deepseek/deepseek-r1:free"
        };
        
        let projects = [];
        let currentProjectId = null;

        // DOM Elements
        const elSettingsModal = document.getElementById('settings-modal');
        const elProjectList = document.getElementById('project-list');
        const elPreviewFrame = document.getElementById('preview-frame');
        const elCodeContainer = document.getElementById('code-container');
        const elCodeView = document.getElementById('code-view');
        const elPromptInput = document.getElementById('prompt-input');
        const elLoading = document.getElementById('loading-overlay');

        // Initialization
        function init() {
            loadSettings();
            loadProjects();
            if (projects.length === 0) {
                createNewProject();
            } else {
                switchProject(projects[0].id);
            }
        }

        // --- Settings Management ---
        function loadSettings() {
            const saved = localStorage.getItem('ai_builder_settings');
            if (saved) settings = { ...settings, ...JSON.parse(saved) };
            
            document.getElementById('setting-url').value = settings.apiUrl;
            document.getElementById('setting-key').value = settings.apiKey;
            document.getElementById('setting-model').value = settings.modelId;
        }

        function saveSettings() {
            settings.apiUrl = document.getElementById('setting-url').value.trim() || "https://openrouter.ai/api/v1/chat/completions";
            settings.apiKey = document.getElementById('setting-key').value.trim();
            settings.modelId = document.getElementById('setting-model').value.trim() || "deepseek/deepseek-r1:free";
            
            localStorage.setItem('ai_builder_settings', JSON.stringify(settings));
            toggleSettings(false);
        }

        function toggleSettings(show) {
            if (show) elSettingsModal.classList.remove('hidden-el');
            else elSettingsModal.classList.add('hidden-el');
        }

        // --- Project Management ---
        function loadProjects() {
            const saved = localStorage.getItem('ai_builder_projects');
            if (saved) projects = JSON.parse(saved);
        }

        function saveProjects() {
            localStorage.setItem('ai_builder_projects', JSON.stringify(projects));
            renderProjectList();
        }

        function createNewProject() {
            const newId = Date.now().toString();
            const proj = {
                id: newId,
                name: `Project ${projects.length + 1}`,
                html: `<!DOCTYPE html>\n<html>\n<head><title>New Site</title><script src="https://cdn.tailwindcss.com"><\/script></head>\n<body class="bg-gray-100 flex items-center justify-center h-screen">\n  <h1 class="text-3xl font-bold text-gray-400">Empty Canvas</h1>\n</body>\n</html>`,
                messages: [] // Stores history for context
            };
            projects.unshift(proj);
            saveProjects();
            switchProject(newId);
        }

        function switchProject(id) {
            currentProjectId = id;
            const proj = projects.find(p => p.id === id);
            if (!proj) return;
            
            renderProjectList();
            updateWorkspace(proj.html);
            setView('preview');
        }

        function renderProjectList() {
            elProjectList.innerHTML = '';
            projects.forEach(p => {
                const isActive = p.id === currentProjectId;
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-2 rounded text-sm truncate transition ${isActive ? 'bg-gray-700 text-white font-semibold' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`;
                btn.innerText = p.name;
                btn.onclick = () => switchProject(p.id);
                elProjectList.appendChild(btn);
            });
        }

        function updateWorkspace(htmlCode) {
            // Clean up code if AI accidentally adds markdown wrapper
            const cleanCode = htmlCode.replace(/^```html\s*/i, '').replace(/```$/i, '').trim();
            
            elPreviewFrame.srcdoc = cleanCode;
            elCodeView.textContent = cleanCode;
        }

        // --- View Toggles ---
        function setView(viewMode) {
            const btnPreview = document.getElementById('btn-preview');
            const btnCode = document.getElementById('btn-code');

            if (viewMode === 'preview') {
                elPreviewFrame.classList.remove('hidden-el');
                elCodeContainer.classList.add('hidden-el');
                btnPreview.className = "px-3 py-1 text-sm rounded bg-gray-700 text-white shadow";
                btnCode.className = "px-3 py-1 text-sm rounded text-gray-400 hover:text-white";
            } else {
                elPreviewFrame.classList.add('hidden-el');
                elCodeContainer.classList.remove('hidden-el');
                btnCode.className = "px-3 py-1 text-sm rounded bg-gray-700 text-white shadow";
                btnPreview.className = "px-3 py-1 text-sm rounded text-gray-400 hover:text-white";
            }
        }

        function downloadHtml() {
            const proj = projects.find(p => p.id === currentProjectId);
            if (!proj) return;
            const blob = new Blob([proj.html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `index.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // --- AI API Interaction ---
        async function handleSend(e) {
            if(e) e.preventDefault();
            
            const prompt = elPromptInput.value.trim();
            if (!prompt) return;

            if (!settings.apiKey) {
                alert("Please add your API Key in Settings first.");
                toggleSettings(true);
                return;
            }

            const projIndex = projects.findIndex(p => p.id === currentProjectId);
            if (projIndex === -1) return;
            let proj = projects[projIndex];

            // Add user prompt to history
            proj.messages.push({ role: "user", content: prompt });
            
            // Generate Project Name from first prompt if it's default
            if (proj.messages.length === 1 && proj.name.startsWith("Project ")) {
                proj.name = prompt.slice(0, 20) + (prompt.length > 20 ? '...' : '');
            }

            elPromptInput.value = '';
            elLoading.classList.remove('hidden-el');

            try {
                const apiPayload = {
                    model: settings.modelId,
                    messages: [
                        { role: "system", content: SYSTEM_PROMPT },
                        ...proj.messages
                    ]
                };

                const response = await fetch(settings.apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${settings.apiKey}`
                    },
                    body: JSON.stringify(apiPayload)
                });

                // CRITICAL FIX 2: Anti-Crash JSON Logic
                const text = await response.text();
                
                if (!response.ok) {
                    alert("API Error: " + text);
                    proj.messages.pop(); // Revert user message on failure
                    return; // STOP Execution
                }

                const data = JSON.parse(text);
                const aiHtml = data.choices[0].message.content;

                // Save assistant response
                proj.messages.push({ role: "assistant", content: aiHtml });
                proj.html = aiHtml;
                
                saveProjects();
                updateWorkspace(aiHtml);

            } catch (error) {
                alert("Network or Parsing Error: " + error.message);
                proj.messages.pop();
            } finally {
                elLoading.classList.add('hidden-el');
            }
        }

        // Boot
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
